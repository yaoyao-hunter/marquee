[package]
name = "marquee"
version = "0.1.0"
edition = "2024"
description = "Terminal marquee / scrolling text with correct CJK, emoji and mixed-width Unicode handling"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
unicode-segmentation = "1"
unicode-width = "0.2"

[workspace]
members = ["tools/gen-bigfont"]
resolver = "3"
